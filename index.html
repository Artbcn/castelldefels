<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Descubre Castelldefels · ART Apartments</title>
<link rel="icon" href="img/icon.png">
<link rel="apple-touch-icon" href="img/icon.png">

<style>
/* VOICE: a calm, upscale host's welcome note
   IDEA: the ART Apartments brand card — thin geometric type, the open gold frame from the logo
   PICTURE: real photos of the building (rooftop pool, lobby, apartments) and the castle
   COLOUR and TYPE: ART gold #b08e68, navy #1e2838, ivory; Barlow light + medium like the logo
   LAYOUT: photo hero with logo, the building, must-sees, local shops, contact */
:root{color-scheme:light dark;
--gold:#b08e68;--gold-ink:light-dark(#8a6a45,#d6b48d);--navy:#1e2838;
--bg:light-dark(#faf8f5,#121925);--ink:light-dark(#1e2838,#f1ece5);--mute:light-dark(#525a66,#b3b9c2);
--soft:light-dark(#f2ece3,#1a2332);--card:light-dark(#ffffff,#1c2636);--line:light-dark(#e6ddd0,#2b3646)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 Barlow,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{line-height:1.08;text-wrap:balance;margin:0;font-weight:400}
h1{font-size:clamp(38px,6.4vw,64px);font-weight:300;color:#fff}
h2{font-size:clamp(28px,4vw,40px);font-weight:300;margin-bottom:8px}
h3{font-size:20px;font-weight:500}
a{color:inherit}
img{display:block;max-width:100%}
.band{padding:clamp(36px,5vw,72px) max(5vw,16px)}
.wrap{max-width:1240px;margin:0 auto}
.lead{color:var(--mute);margin:0 0 26px;max-width:62ch}
/* hero */
header{position:relative;min-height:min(88vh,760px);display:flex;flex-direction:column;color:#fff;background:var(--navy);overflow:hidden}
header>img.bgimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
header::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(30,40,56,.92) 0%,rgba(30,40,56,.6) 45%,rgba(30,40,56,.1) 100%),linear-gradient(0deg,rgba(30,40,56,.7),transparent 40%)}
header>*{position:relative;z-index:1}
header>img.bgimg{position:absolute;z-index:0}
header::after{z-index:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding:24px max(5vw,16px)}
.logo{width:clamp(130px,16vw,180px);height:auto}
.hero{margin-top:auto;padding:0 max(5vw,16px) clamp(40px,7vw,90px);max-width:1240px;width:100%;margin-inline:auto}
.hero .frame{border-left:2px solid var(--gold);border-bottom:2px solid var(--gold);padding:0 0 22px 24px;max-width:640px}
.hero p{font-size:18px;color:#e9e4dc;margin:16px 0 0;max-width:34em}
.lang{display:inline-flex;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:3px}
.lang button{font:500 15px Barlow,sans-serif;border:0;background:none;color:#fff;min-height:44px;min-width:44px;padding:0 12px;border-radius:999px;cursor:pointer}
.lang button[aria-pressed=true]{background:var(--gold);color:#fff}
button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
/* building */
.bld{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.6fr);gap:clamp(24px,4vw,56px);align-items:start}
.addr{display:inline-block;margin-top:6px;font-weight:500;color:var(--gold-ink)}
.gal{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.gal figure{margin:0;position:relative;border-radius:14px;overflow:hidden;aspect-ratio:4/3;background:var(--soft)}
.gal figure:first-child{grid-column:1/-1;aspect-ratio:16/8}
.gal img{width:100%;height:100%;object-fit:cover}
.gal figcaption{position:absolute;left:10px;bottom:10px;background:rgba(30,40,56,.82);color:#fff;font-size:14px;font-weight:500;padding:4px 10px;border-radius:999px}
/* must-sees */
.mustg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.7fr);gap:16px}
.feat{position:relative;border-radius:18px;overflow:hidden;min-height:420px;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;padding:24px}
.feat img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.feat::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(30,40,56,.9),rgba(30,40,56,0) 60%)}
.feat>*:not(img){position:relative;z-index:1}
.feat p{margin:6px 0 0;color:#ece6dd}
.feat .map{color:#fff}
.must{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.m{background:var(--soft);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:6px}
.m p{margin:0;color:var(--mute)}
.k{font-size:14px;font-weight:500;color:var(--gold-ink)}
.feat .k{color:#e8cba7}
/* shops */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
.chips button{font:500 15px Barlow,sans-serif;min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.chips button[aria-pressed=true]{background:var(--navy);color:#fff;border-color:var(--navy)}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.p{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:6px}
.p .c{font-size:14px;color:var(--gold-ink);font-weight:500}
.p p{margin:0;font-size:16px}
.p .a{font-size:15px;color:var(--mute)}
.row{margin-top:auto;padding-top:8px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.near{font-size:13px;font-weight:600;background:var(--gold);color:#fff;border-radius:999px;padding:3px 10px;white-space:nowrap}
.map{font-weight:600;font-size:16px;text-decoration:none;color:var(--gold-ink);min-height:44px;display:inline-flex;align-items:center}
/* footer */
footer{background:var(--navy);color:#fff}
footer .g{display:grid;grid-template-columns:auto minmax(0,1.2fr) minmax(0,1fr);gap:clamp(24px,4vw,56px);align-items:start}
footer p{margin:8px 0;color:#dfe3ea}
footer .logo{width:150px}
footer a.map{color:#e8cba7}
.small{font-size:14px;color:#b9c0cb}
@media(max-width:860px){.bld,.mustg,footer .g{grid-template-columns:minmax(0,1fr)}.feat{min-height:360px}}
@media(max-width:560px){.must{grid-template-columns:minmax(0,1fr)}.gal{grid-template-columns:minmax(0,1fr)}.gal figure:first-child{aspect-ratio:4/3}header{min-height:640px}}
@media (prefers-reduced-motion:no-preference){header>img.bgimg{animation:zoom 14s ease-out both}@keyframes zoom{from{transform:scale(1.08)}}}
</style>
</head>
