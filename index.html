<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Descubre Castelldefels · ART Apartments</title>
<link rel="icon" href="img/icon.png">
<link rel="apple-touch-icon" href="img/icon.png">
<meta name="theme-color" content="#1e2838">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: a concierge in your pocket — quick, calm, upscale
   IDEA: a hotel guest app: home screen of big tiles, each opens one answer
   PICTURE: the rooftop pool in a slim welcome card; tiles with thin gold line icons like the logo frame
   COLOUR and TYPE: ART gold #b08e68, navy #1e2838, ivory; Barlow light + medium
   LAYOUT: app bar, welcome card, tiles grid, "closest to you" list; views replace home with a back button */
:root{color-scheme:light dark;
--gold:#b08e68;--gold-ink:light-dark(#8a6a45,#d6b48d);--navy:#1e2838;
--bg:light-dark(#f6f3ee,#111824);--ink:light-dark(#1e2838,#f1ece5);--mute:light-dark(#525a66,#b3b9c2);
--card:light-dark(#ffffff,#1b2535);--line:light-dark(#e6ddd0,#2b3646);--soft:light-dark(#efe8dd,#182131)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 Barlow,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{margin:0;line-height:1.1;text-wrap:balance;font-weight:500}
a{color:inherit}img{display:block;max-width:100%}
.bar{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px max(4vw,14px)}
.bar .logo{height:40px;width:auto}
.lang{display:inline-flex;background:rgba(255,255,255,.1);border-radius:999px;padding:3px}
.lang button{font:500 14px Barlow,sans-serif;border:0;background:none;color:#fff;min-height:40px;min-width:40px;border-radius:999px;cursor:pointer}
.lang button[aria-pressed=true]{background:var(--gold)}
button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
main{max-width:860px;margin:0 auto;padding:16px max(4vw,14px) 40px}
/* welcome */
.hello{position:relative;border-radius:20px;overflow:hidden;color:#fff;min-height:150px;display:flex;flex-direction:column;justify-content:flex-end;padding:18px 20px;background:var(--navy)}
.hello img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hello::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(30,40,56,.88),rgba(30,40,56,.15))}
.hello>*:not(img){position:relative;z-index:1}
.hello h1{font-size:clamp(26px,5vw,34px);font-weight:300}
.hello p{margin:4px 0 0;color:#e7e1d8;font-size:16px}
/* tiles */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:16px 0 24px}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:16px;min-height:104px;padding:12px 6px;font-weight:500;font-size:15px;line-height:1.15}
.tile svg{width:32px;height:32px;stroke:var(--gold);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tile:active{transform:scale(.97)}
@media(min-width:640px){.tile{min-height:120px;font-size:16px}}
.acc{display:grid;grid-template-columns:40px minmax(0,1fr) 22px;align-items:center;gap:12px;margin:14px 0 0;padding:16px 18px;border-radius:18px;background:var(--gold);color:#fff;text-decoration:none}
.acc svg{width:34px;height:34px;stroke:#fff;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.acc .chev{width:22px;height:22px;stroke-width:2}
.acc b{display:block;font-size:20px;font-weight:500}.acc small{display:block;font-size:15px;color:#fbf3e8}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.steps li{display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;align-items:start;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;font-size:16.5px}
.num{width:34px;height:34px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:600}
:root[data-theme=dark] .num{background:var(--gold)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .num{background:var(--gold)}}
.vr video{grid-column:1/-1;width:100%;border-radius:12px;margin-top:8px;background:#000;max-height:70vh;object-fit:contain}
.lav{grid-column:1/-1;width:100%;max-width:360px;border-radius:12px;margin-top:8px}
.tiles.main{grid-template-columns:repeat(2,minmax(0,1fr))}
.tiles.main .tile{flex-direction:row;justify-content:flex-start;text-align:left;min-height:64px;padding:12px 14px;gap:12px;font-size:16px}
.tiles.main .tile svg{width:28px;height:28px;flex:none}
@media(min-width:640px){.tiles.main{grid-template-columns:repeat(4,minmax(0,1fr))}.tiles.main .tile{min-height:72px}}
.wifi{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin:12px 0}
.wifi svg{width:30px;height:30px;stroke:var(--gold);fill:none;stroke-width:1.8;stroke-linecap:round}
.wifi b{display:block;font-size:18px;font-weight:500}.wifi span{display:block;font-size:15.5px;color:var(--mute)}.wifi strong{color:var(--ink);font-weight:600;overflow-wrap:anywhere}
.cp{font:500 15px Barlow,sans-serif;min-height:44px;padding:0 16px;border-radius:999px;border:0;background:var(--navy);color:#fff;cursor:pointer}
:root[data-theme=dark] .cp{background:var(--gold)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .cp{background:var(--gold)}}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.stats b{display:block;font-size:24px;font-weight:400;color:var(--gold-ink)}.stats span{font-size:15px;color:var(--mute)}

.sec{font-size:22px;font-weight:500;margin:4px 0 12px}
/* rows */
.rows{display:grid;gap:10px}
.r{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center}
.r h3{font-size:18px}
.r .meta{font-size:15px;color:var(--mute)}
.r p{margin:2px 0 0;font-size:15.5px;color:var(--mute);grid-column:1/-1}
.r .acts{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.go{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:0 14px;border-radius:999px;background:var(--navy);color:#fff;text-decoration:none;font-weight:500;font-size:15px}
.go.alt{background:transparent;color:var(--gold-ink);border:1px solid var(--line)}
:root[data-theme=dark] .go{background:var(--gold)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .go:not(.alt){background:var(--gold)}}
.mins{font-weight:600;color:var(--gold-ink);font-size:15px;white-space:nowrap;text-align:right}
.tag{display:inline-block;font-size:12.5px;font-weight:600;background:var(--gold);color:#fff;border-radius:999px;padding:2px 8px;margin-left:6px;vertical-align:2px}
/* view */
.vhead{display:flex;align-items:center;gap:10px;margin:2px 0 14px}
.back{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px 0 10px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);text-decoration:none;font-weight:500}
.vhead h2{font-size:clamp(24px,5vw,30px);font-weight:400}
.lead{color:var(--mute);margin:0 0 14px}
.big{background:var(--navy);color:#fff;border-radius:18px;padding:18px 20px;margin-bottom:12px;display:grid;gap:6px}
.big .n{font-size:clamp(28px,6vw,38px);font-weight:300;line-height:1.05}
.big p{margin:0;color:#dfe3ea}
.big .go{background:var(--gold);justify-self:start}
.lines{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:8px;grid-column:1/-1}
.lines li{display:flex;gap:10px;align-items:baseline;font-size:16px}
.ln{flex:none;font-weight:600;font-size:13.5px;background:var(--gold);color:#fff;border-radius:6px;padding:2px 8px;min-width:44px;text-align:center}
.zone{display:grid;grid-template-columns:10px minmax(0,1fr);gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.zone .sw{border-radius:5px}.zone p{margin:2px 0 0;color:var(--mute);font-size:15.5px}
.zb{background:#1f5fbf}.zv{background:#2e9b4f}.zw{background:#fff;border:1.5px dashed #8a8f98}.zy{background:#f2c200}.zo{background:#ef7d1a}
.mini{grid-column:1/-1;margin:6px 0 0;padding-left:20px;color:var(--mute);font-size:15.5px;display:grid;gap:4px}
.tip{font-size:14.5px;color:var(--mute);margin:14px 2px 0}
.photo{border-radius:16px;overflow:hidden;aspect-ratio:16/9;background:var(--soft)}
.photo img{width:100%;height:100%;object-fit:cover}
.gal{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}
.gal .photo{aspect-ratio:4/3}
.contact{background:var(--navy);color:#fff;border-radius:18px;padding:18px 20px;margin-top:24px;display:grid;gap:4px}
.contact p{margin:0;color:#dfe3ea;font-size:16px}
.contact .go{background:var(--gold);justify-self:start;margin-top:8px}
.note{font-size:13.5px;color:var(--mute);margin-top:18px;text-align:center}
@media (prefers-reduced-motion:no-preference){#view{animation:in .25s ease-out}@keyframes in{from{opacity:0;transform:translateY(8px)}}}
</style>
</head>

  <article class="r"><h3>${esc(t.trainT)}</h3><p>${esc(t.trainD)}</p><ul class="lines"><li><span class="ln">R2S</span><span>Castelldefels → Barcelona Sants · Passeig de Gràcia</span></li></ul></article>
  <article class="r"><h3>${esc(t.busT)}</h3><p>${esc(t.busD)}</p><ul class="lines">${[["L94",t.l94],["L95",t.l95],["E95",t.e95],["L97",t.l97],["N16",t.n16]].map(z=>`<li><span class="ln">${z[0]}</span><span>${esc(z[1])}</span></li>`).join("")}</ul></article></div><p class="tip">${esc(t.trTip)}</p>`;
 if(k==="parking")return head(k)+`<p class="lead">${esc(t.pkL)}</p><div class="rows">${[["zb",t.zb,t.zbD],["zv",t.zv,t.zvD],["zw",t.zw,t.zwD],["zy",t.zy,t.zyD]].map(z=>`<div class="zone"><div class="sw ${z[0]}"></div><div><h3>${esc(z[1])}</h3><p>${esc(z[2])}</p></div></div>`).join("")}
  <div class="zone"><div class="sw zo"></div><div><h3>${esc(x.zo)}</h3><p>${esc(x.zoD)}</p><div class="acts" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">${[["Carrer de Mèxic, Castelldefels",x.zoP[0]],["Passeig del Pitort, Castelldefels",x.zoP[1]]].map(p=>go(dirUrl("Pàrquing "+p[0],false),p[1],1)).join("")}</div></div></div></div>
  <h2 class="sec" style="margin-top:22px">${esc(x.payT)}</h2>
  <div class="rows"><article class="r"><h3>${esc(x.payApp)}</h3><p>${esc(x.payAppD)}</p><div class="acts">${go(APQ_IOS,"Apparquem · "+x.ios)}${go(APQ_AND,"Apparquem · "+x.android)}${go("https://www.apparquem.cat",x.web,1)}</div></article>
  <article class="r"><h3>${esc(x.payMeter)}</h3><ol class="mini">${x.payMeterS.map(p=>`<li>${esc(p)}</li>`).join("")}</ol><p>${esc(x.payWhere)}</p><div class="acts">${go(PLAN_PDF,x.plan,1)}</div></article></div>
  <h2 class="sec" style="margin-top:22px">${esc(t.freeT)}</h2><div class="rows">${FREE.map(f=>`<article class="r"><h3>${esc(f.n[i()])}</h3>${mins(f.t)}<div class="acts">${go(dirUrl(f.ll,false),ml())}</div></article>`).join("")}</div><p class="tip">${esc(t.pkTip)}</p>`;
 if(k==="local"){const near=P.filter(p=>p.t&&p.t<=4||p.near).sort((a,b)=>(a.t||5)-(b.t||5));
  return head(k)+`<p class="lead">${esc(x.locSub)}</p><nav class="tiles">${LOCAL.map(tile).join("")}</nav><h2 class="sec">${esc(x.nearT)}</h2><div class="rows">${near.map(row).join("")}</div>`}
 if(k==="sights")return head(k)+`<div class="photo" style="margin-bottom:10px"><img src="img/castillo.jpg" alt=""></div><div class="rows">${[MUST[1],...MUST.filter((m,j)=>j!==1)].map(m=>`<article class="r"><h3>${esc(m.n[i()])}</h3><p>${esc(m.d[i()])}</p><div class="acts">${go(dirUrl(m.q,false),ml())}</div></article>`).join("")}</div>`;
 if(k==="help")return head(k)+`<p class="lead">${esc(x.helpL)}</p><div class="rows">${VIDS.map((f,j)=>vid(f,j)).join("")}</div>`;
 if(k==="contact")return head(k)+contact().replace('class="contact"','class="contact" style="margin-top:0"')+`<div class="rows" style="margin-top:14px"><article class="r"><h3>${esc(t.moreT)}</h3><p>${esc(t.moreL)}</p><div class="acts">${go("https://www.associaciocec.org/associats/","associaciocec.org",1)}</div></article></div>`;
 return home()}

function render(){
 document.documentElement.lang=L;
 document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===L));
 const k=location.hash.slice(1);
 const v=document.getElementById("view");
 v.innerHTML=VIEWS.has(k)?view(k):home();
 v.style.animation="none";void v.offsetWidth;v.style.animation="";
}
document.querySelector(".lang").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;L=b.dataset.l;try{localStorage.setItem("cdf-lang",L)}catch(err){}render()});
document.getElementById("view").addEventListener("click",async e=>{const b=e.target.closest(".cp");if(!b)return;try{await navigator.clipboard.writeText(b.dataset.copy);b.textContent=X[L].copied;setTimeout(()=>b.textContent=X[L].copy,1800)}catch(err){}});
window.addEventListener("hashchange",()=>{render();window.scrollTo(0,0)});
render();
}
</script>
</body>
</html>
